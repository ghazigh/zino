name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate compose config
        run: |
          cp .env.example .env
          # Placeholder for the required-but-empty secret so the `:?` guard
          # does not fail validation.
          sed -i 's/^WEBUI_SECRET_KEY=$/WEBUI_SECRET_KEY=ci/' .env
          docker compose config --quiet

  scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint deploy scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/*.sh
      - name: Check scripts are executable
        run: |
          for f in scripts/bootstrap.sh scripts/deploy.sh scripts/enable-oidc.sh scripts/destroy.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      # No backend and no credentials: validates syntax and types only.
      - run: terraform init -backend=false
      - run: terraform validate
