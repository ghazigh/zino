name: Deploy Firebase Hosting

# ZINO ships no container of its own — Cloud Run runs the upstream Open WebUI
# image, and changes to it are applied with `terraform apply`. The only thing
# CI publishes is the Hosting config (the rewrite that points your domain at
# Cloud Run), so this only runs when that config actually changes.
on:
  push:
    branches: [main]
    paths:
      - "firebase.json"
      - "infra/firebase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# `id-token: write` lets the runner mint the OIDC token GCP exchanges for
# short-lived credentials. No service-account key is ever created.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy hosting
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Verify the site responds
        run: |
          URL="https://${{ vars.GCP_PROJECT_ID }}.web.app"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            # Any non-5xx means the rewrite reached Cloud Run; a login redirect
            # is a success, not a failure.
            if [ -n "$CODE" ] && [ "$CODE" -lt 500 ]; then
              echo "site responded with $CODE"; exit 0
            fi
            echo "attempt $i got '$CODE'; retrying"; sleep 10
          done
          echo "site did not respond" >&2; exit 1
