name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Workload Identity Federation: `id-token: write` lets the runner
# mint the OIDC token GCP exchanges for short-lived credentials. No SA key.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: zino-agents

jobs:
  deploy-agents:
    name: Deploy agent gateway
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        id: build
        run: |
          REPO="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/zino/${SERVICE}"
          docker build -t "${REPO}:${GITHUB_SHA}" services/zino-agents
          docker push "${REPO}:${GITHUB_SHA}"
          # Deploy by digest, not tag: a tag can be repointed, a digest cannot,
          # so the running revision is always exactly what CI built.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REPO}:${GITHUB_SHA}")
          echo "image=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${{ steps.build.outputs.image }}" \
            --region="${REGION}" \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" --format='value(status.url)')
          # /healthz is unauthenticated by design, so this needs no token.
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${URL}/healthz" | tee /dev/stderr | grep -q '"status":"ok"'; then
              echo "healthy"; exit 0
            fi
            echo "attempt ${i} failed; retrying"; sleep 5
          done
          echo "gateway did not become healthy" >&2
          exit 1

  deploy-hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-agents
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
