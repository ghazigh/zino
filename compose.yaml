# Local development stack. Mirrors the GCP topology (Postgres + pgvector) so
# behaviour differences surface here, not in production.
#
#   cp .env.example .env && make up
#
# The one deliberate difference: file storage is local disk, not GCS.
#
# Model providers and agents are NOT configured here. Add them in the admin UI
# once the stack is up — Open WebUI saves them to the database, so they persist
# across restarts. See docs/configuring.md.

name: zino

services:
  db:
    # pgvector on top of Postgres 16 — the local stand-in for Cloud SQL with the
    # vector extension enabled.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zino-local-dev}
      POSTGRES_DB: zino
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zino -d zino"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  webui:
    # Pinned. Bump ZINO_OPENWEBUI_VERSION in .env to take an upstream release,
    # and read docs/upgrading.md before you do.
    image: ghcr.io/open-webui/open-webui:${ZINO_OPENWEBUI_VERSION:-v0.9.6}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBUI_NAME: ZINO
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_URL: http://localhost:3000

      DATABASE_URL: postgresql://zino:${POSTGRES_PASSWORD:-zino-local-dev}@db:5432/zino
      VECTOR_DB: pgvector
      # PGVECTOR_DB_URL defaults to DATABASE_URL upstream; set explicitly so the
      # two are not silently coupled if the main database ever moves.
      PGVECTOR_DB_URL: postgresql://zino:${POSTGRES_PASSWORD:-zino-local-dev}@db:5432/zino

      # No Ollama by default; flip on in .env if you run one locally.
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA_API:-false}
    volumes:
      # Uploads only. Everything else lives in Postgres.
      - webui-data:/app/backend/data
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  db-data:
  webui-data:
